<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>420RS — Resource Sharing</title>
    <meta name="description" content="420RS — Chia sẻ tài nguyên miễn phí cho cộng đồng">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a href="#" class="logo">420<span class="logo-accent">RS</span></a>
            <div class="nav-links">
                <a href="#gallery" class="nav-link active" data-section="gallery">Explore</a>
                <a href="#" class="nav-link" id="adminToggle">Admin</a>
            </div>
        </div>
    </nav>

    <!-- ===== FILTER BAR ===== -->
    <section class="filter-section" id="gallery">
        <div class="filter-inner">
            <div class="filter-chips" id="filterChips">
                <button class="chip active" data-cat="all">All</button>
                <button class="chip" data-cat="image">Images</button>
                <button class="chip" data-cat="document">Docs</button>
                <button class="chip" data-cat="code">Code</button>
                <button class="chip" data-cat="video">Video</button>
                <button class="chip" data-cat="tool">Tools</button>
                <button class="chip" data-cat="other">Other</button>
            </div>
            <div class="search-wrap">
                <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search..." class="search-input">
            </div>
        </div>
    </section>

    <!-- ===== MASONRY GRID ===== -->
    <main class="gallery-section">
        <div class="masonry" id="masonry">
            <!-- JS renders cards here -->
        </div>
        <div class="empty" id="emptyState" style="display:none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10" />
                <path d="M8 15h8" />
                <circle cx="9" cy="9" r="1" />
                <circle cx="15" cy="9" r="1" />
            </svg>
            <p>Không tìm thấy tài nguyên nào.</p>
        </div>
    </main>

    <!-- ===== ADMIN PANEL (Hidden by default) ===== -->
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-panel">
            <div class="admin-header">
                <h2>Admin Upload</h2>
                <button class="close-btn" id="adminClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <!-- Auth Gate -->
            <div class="auth-gate" id="authGate">
                <p>Nhập mật khẩu admin:</p>
                <div class="auth-row">
                    <input type="password" id="adminPass" class="input" placeholder="Password" autocomplete="off">
                    <button class="btn-primary" id="authBtn">Unlock</button>
                </div>
            </div>

            <!-- Upload Form (hidden until auth) -->
            <form class="upload-form" id="uploadForm" style="display:none;">
                <input type="text" id="resName" class="input" placeholder="Tên tài nguyên" required>
                <select id="resCat" class="input" required>
                    <option value="">Danh mục</option>
                    <option value="image">Images</option>
                    <option value="document">Docs</option>
                    <option value="code">Code</option>
                    <option value="video">Video</option>
                    <option value="tool">Tools</option>
                    <option value="other">Other</option>
                </select>
                <textarea id="resDesc" class="input" placeholder="Mô tả ngắn" rows="2"></textarea>
                <input type="url" id="resUrl" class="input" placeholder="Link tải / URL" required>
                <input type="text" id="resTags" class="input" placeholder="Tags (vd: react, free, tool)">

                <!-- Thumbnail -->
                <div class="drop-area" id="dropArea">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <span>Kéo thả thumbnail hoặc <u>chọn file</u></span>
                    <input type="file" id="thumbFile" accept="image/*" hidden>
                </div>
                <div class="thumb-preview" id="thumbPreview" style="display:none;">
                    <img id="thumbImg" alt="thumb">
                    <button type="button" class="remove-thumb" id="removeThumb">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>

                <button type="submit" class="btn-primary btn-full">Đăng tài nguyên</button>
            </form>

            <!-- Manage existing -->
            <div class="manage-list" id="manageList" style="display:none;">
                <h3>Quản lý</h3>
                <div id="manageItems"></div>
            </div>
        </div>
    </div>

    <!-- ===== DETAIL LIGHTBOX ===== -->
    <div class="lightbox" id="lightbox">
        <button class="lb-close" id="lbClose">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <div class="lb-body" id="lbBody"></div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-box" id="toastBox"></div>

    <script src="app.js"></script>
</body>

</html>
