<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>420RS — Resource Sharing</title>
    <meta name="description" content="420RS — Chia sẻ tài nguyên miễn phí cho cộng đồng">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VH31JZKJQ2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-VH31JZKJQ2');
    </script>
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a href="#" class="logo">420<span class="logo-accent">RS</span></a>
            <div class="nav-links">
                <a href="#gallery" class="nav-link active" data-section="gallery">Explore</a>
            </div>
        </div>
    </nav>

    <!-- ===== FILTER BAR ===== -->
    <section class="filter-section" id="gallery">
        <div class="filter-inner">
            <div class="filter-chips" id="filterChips">
                <!-- JS renders dynamically -->
            </div>
            <div class="search-wrap">
                <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search..." class="search-input">
            </div>
        </div>
    </section>

    <!-- ===== MASONRY GRID ===== -->
    <main class="gallery-section">
        <div class="masonry" id="masonry">
            <!-- JS renders cards here -->
        </div>
        <div class="empty" id="emptyState" style="display:none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10" />
                <path d="M8 15h8" />
                <circle cx="9" cy="9" r="1" />
                <circle cx="15" cy="9" r="1" />
            </svg>
            <p>Không tìm thấy tài nguyên nào.</p>
        </div>
    </main>

    <!-- ===== ADMIN PANEL (Hidden by default) ===== -->
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-panel">
            <div class="admin-header">
                <h2>Admin Upload</h2>
                <button class="close-btn" id="adminClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <!-- Auth Gate -->
            <div class="auth-gate" id="authGate">
                <p>Nhập mật khẩu admin:</p>
                <div class="auth-row">
                    <input type="password" id="adminPass" class="input" placeholder="Password" autocomplete="off">
                    <button class="btn-primary" id="authBtn">Unlock</button>
                </div>
            </div>

            <!-- Upload Form (hidden until auth) -->
            <form class="upload-form" id="uploadForm" style="display:none;">
                <input type="text" id="resName" class="input" placeholder="Tên tài nguyên" required>
                <select id="resCat" class="input" required>
                    <option value="">Danh mục</option>
                    <!-- JS populates -->
                </select>
                <textarea id="resDesc" class="input" placeholder="Mô tả ngắn" rows="2"></textarea>
                <input type="url" id="resUrl" class="input" placeholder="Link tải / URL" required>
                <input type="text" id="resTags" class="input" placeholder="Tags (vd: react, free, tool)">

                <!-- Thumbnail -->
                <input type="url" id="thumbUrl" class="input" placeholder="Link ảnh Thumbnail (Imgur, Drive...)">

                <button type="submit" class="btn-primary btn-full">Đăng tài nguyên</button>
            </form>

            <!-- Category Manager -->
            <div class="manage-list" id="catManager" style="display:none;">
                <h3>Danh mục</h3>
                <div id="catItems"></div>
                <div class="auth-row" style="margin-top:8px;">
                    <input type="text" id="newCatKey" class="input" placeholder="key (vd: design)">
                    <input type="text" id="newCatLabel" class="input" placeholder="Label (vd: Design)">
                    <button class="btn-primary" id="addCatBtn" style="padding:9px 14px;">+</button>
                </div>
            </div>

            <!-- Manage existing -->
            <div class="manage-list" id="manageList" style="display:none;">
                <h3>Tài nguyên</h3>
                <div id="manageItems"></div>
            </div>
        </div>
    </div>

    <!-- ===== DETAIL LIGHTBOX ===== -->
    <div class="lightbox" id="lightbox">
        <button class="lb-close" id="lbClose">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <div class="lb-body" id="lbBody"></div>
    </div>

    <!-- ===== DONATE ===== -->
    <button class="donate-fab" id="donateBtn" title="Donate / Ủng hộ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
    </button>
    <div class="donate-overlay" id="donateOverlay">
        <div class="donate-modal">
            <button class="donate-close" id="donateClose">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h3>Ủng hộ Team 420RS ☕</h3>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin-top:8px;margin-bottom:20px;">Cảm ơn bạn đã
                tiếp lửa cho dự án!</p>
            <img src="https://cdn.discordapp.com/attachments/1489840906709504185/1490561119180423168/image.png?ex=69d480b8&is=69d32f38&hm=45d4927c0a35a71817f476c0d26644b850db83aa1faae1f2d3c9157ef0159b95&"
                alt="Donate QR" style="width: 100%; max-width: 250px; border-radius: 12px; border: 4px solid white;">
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-box" id="toastBox"></div>

    <script src="app.js"></script>
</body>

</html>
